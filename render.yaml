services:
  - type: web
    name: getu-server
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: STORAGE_MODE
        value: file
      - key: DATA_STORE
        value: file
      - key: AUTOMATION_MODE
        value: dry-run
      - key: AI_ENGINE
        value: offline
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
