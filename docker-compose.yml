version: '3.8'

services:
  getu-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getu-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - DATA_STORE=file
      - AUTOMATION_MODE=dry-run
      - AI_ENGINE=offline
      - LOG_LEVEL=info
    volumes:
      # Persist local database and generated resumes across restarts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
